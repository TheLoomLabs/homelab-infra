---
kubernetes_minor_version: "1.37"
cluster_name: homelab
pod_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12
cluster_dns_domain: cluster.local

# renovate: datasource=docker depName=ghcr.io/kube-vip/kube-vip
kube_vip_version: v1.3.1
# renovate: datasource=github-releases depName=cilium/cilium extractVersion=^v(?<version>.+)$
cilium_version: 1.20.3
# renovate: datasource=github-releases depName=cilium/cilium-cli
cilium_cli_version: v0.20.1
# true: network policies only log what they would drop (verdict AUDIT in
# Hubble) instead of dropping it. Cluster-wide; off since the B.4 review
# (2026-10-22). New apps are watched with `hubble observe --verdict DROPPED`
# instead (docs/network-policy.md); `make cilium` applies a change.
cilium_policy_audit_mode: false
# renovate: datasource=github-releases depName=helm/helm
helm_version: v4.3.1 # installed on the first control-plane node for the Argo CD bootstrap

# Gateway API CRDs (standard channel) for Cilium's Gateway controller. Keep this
# at the version the Cilium release supports (see the Cilium Gateway API docs).
# The checksum pins the release asset standard-install.yaml.
# renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
gateway_api_version: v1.6.3
gateway_api_crds_sha256: 356c2b8e286a964dc20995435659ad1095386329974793af10bbfe3eff977fe5

# Pod and service traffic must pass the host firewall too.
trusted_cidrs:
  - "{{ lab_network_cidr }}"
  - "{{ pod_cidr }}"
  - "{{ service_cidr }}"

# The kubeconfig is fetched here on the machine running Ansible (git-ignored).
kubeconfig_local_path: "{{ playbook_dir }}/../../.artifacts/kubeconfig"
