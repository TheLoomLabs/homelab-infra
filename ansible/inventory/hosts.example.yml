---
# Example only. The real inventory (hosts.yml) is generated by Terraform and
# git-ignored. Use this file to run Ansible against hand-made VMs.
all:
  vars:
    ansible_user: ops
    k8s_api_vip: 192.168.10.20
    lab_network_cidr: 192.168.10.0/24
    lab_dns_domain: lab.example.internal
    lab_dns_servers: [192.168.10.11, 192.168.10.12]
    upstream_dns_servers: [1.1.1.1, 9.9.9.9]
  children:
    dns:
      hosts:
        dns-01: {ansible_host: 192.168.10.11}
        dns-02: {ansible_host: 192.168.10.12}
    k8s_control_plane:
      hosts:
        k8s-cp-01: {ansible_host: 192.168.10.21}
        k8s-cp-02: {ansible_host: 192.168.10.22}
        k8s-cp-03: {ansible_host: 192.168.10.23}
    k8s_workers:
      hosts:
        k8s-wk-01: {ansible_host: 192.168.10.31}
        k8s-wk-02: {ansible_host: 192.168.10.32}
    swarm_managers:
      hosts:
        swarm-m-01: {ansible_host: 192.168.10.41}
        swarm-m-02: {ansible_host: 192.168.10.42}
        swarm-m-03: {ansible_host: 192.168.10.43}
    swarm_workers:
      hosts: {}
    k8s:
      children:
        k8s_control_plane:
        k8s_workers:
    swarm:
      children:
        swarm_managers:
        swarm_workers:
