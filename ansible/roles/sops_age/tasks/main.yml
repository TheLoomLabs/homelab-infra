---
# Puts the age private key into the cluster so sops-secrets-operator can
# decrypt SopsSecret resources. This is the only secret that cannot come from
# Git, because it is the key to all the others. The key is sent to kubectl on
# stdin and never written to disk on the node. When the key changes, the
# operator sees the new file within about a minute (mounted Secrets are
# refreshed by the kubelet) and needs no restart.

- name: Check for the age key on the machine running Ansible
  ansible.builtin.stat:
    path: "{{ sops_age_key_local_path }}"
  delegate_to: localhost
  become: false
  register: sops_age_key_file

- name: Fail if the age key is missing
  ansible.builtin.assert:
    that: sops_age_key_file.stat.exists
    fail_msg: >-
      No age key at {{ sops_age_key_local_path }}. Restore it from the backup,
      or create a new one with `age-keygen -o .artifacts/age.key` (docs/secrets.md).
    quiet: true

- name: Encode the age key
  ansible.builtin.set_fact:
    sops_age_key_b64: "{{ lookup('ansible.builtin.file', sops_age_key_local_path, rstrip=false) | b64encode }}"
  no_log: true

- name: Read the age key Secret in the cluster
  ansible.builtin.command: >-
    kubectl --namespace {{ sops_age_namespace }} get secret {{ sops_age_secret_name }}
    --output jsonpath={.data.{{ sops_age_secret_key }}}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: sops_age_current
  changed_when: false
  failed_when: false
  no_log: true

- name: Apply the namespace and the age key Secret
  ansible.builtin.command:
    cmd: kubectl apply --server-side --field-manager=ansible --filename -
    stdin: "{{ lookup('ansible.builtin.template', 'age-key-secret.yaml.j2') }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: sops_age_current.stdout != sops_age_key_b64
  changed_when: true
  no_log: true
