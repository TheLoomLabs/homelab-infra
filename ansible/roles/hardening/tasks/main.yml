---
- name: SSH | Harden sshd via drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Sysctl | Apply kernel and network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-hardening.conf
    reload: true
  loop: "{{ hardening_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Firewall | Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Firewall | Allow SSH from admin networks
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
    comment: ssh
  loop: "{{ ssh_allowed_cidrs }}"

- name: Firewall | Trust cluster networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    comment: trusted network
  loop: "{{ trusted_cidrs }}"

- name: Firewall | Extra rules
  community.general.ufw:
    rule: "{{ item.rule | default('allow') }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from_ip | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ hardening_ufw_extra_rules }}"

- name: Firewall | Routed traffic policy
  community.general.ufw:
    default: "{{ hardening_ufw_routed_policy }}"
    direction: routed

- name: Firewall | Default deny incoming, enable
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: Fail2ban | Install
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: hardening_fail2ban_enabled

- name: Fail2ban | Configure sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      bantime = 1h
      ignoreip = 127.0.0.1/8 {{ ssh_allowed_cidrs | join(' ') }}
    owner: root
    group: root
    mode: "0644"
  when: hardening_fail2ban_enabled
  notify: Restart fail2ban
