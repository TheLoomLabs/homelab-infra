---
common_packages:
  - apt-transport-https
  - ca-certificates
  - chrony
  - curl
  - gnupg
  - htop
  - jq
  - qemu-guest-agent
  - unattended-upgrades
  - vim

common_journald_max_use: 500M

# Resolvers and search domain of every VM (from the Terraform inventory). The
# DNS VMs override this with the public resolvers (group_vars/dns.yml). An
# empty list leaves the resolvers cloud-init set on first boot.
common_dns_servers: "{{ lab_dns_servers | default([]) }}"
# No search domain: the lab zone has a wildcard (*.lab.theloomlabs.org -> the
# Gateway), so with a search domain every unknown name also "exists" as
# <name>.lab.theloomlabs.org. Pods (ndots:5) try the search domains first, so
# external names such as <account>.r2.cloudflarestorage.com resolved to the
# Gateway. Use full names (k8s-cp-01.lab.theloomlabs.org) instead.
common_dns_search: []
common_netplan_file: /etc/netplan/50-cloud-init.yaml

# IPv6 router advertisements. The Starlink router advertises a public /64, so
# with RAs on every VM gets a globally routable address (SLAAC) next to its
# LAN IPv4. Nothing in the lab uses IPv6, so the VMs ignore RAs and keep only
# their fe80:: link-local address. This must be the netplan setting
# (systemd-networkd IPv6AcceptRA=): networkd always disables the kernel's RA
# handling and runs SLAAC itself, so the accept_ra/autoconf sysctls change
# nothing on these interfaces.
common_ipv6_accept_ra: false
