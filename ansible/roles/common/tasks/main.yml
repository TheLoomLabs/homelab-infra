---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

# Cloud-init only sets a VM up on first boot (ADR 0008); Ansible owns it
# afterwards. If cloud-init runs its once-per-instance modules again, it
# regenerates the SSH host keys and resets the admin user's password. That
# happened on swarm-m-01 after a power cut (2026-10-17). This file stops
# cloud-init on every later boot. Remove it to let cloud-init run again, for
# example before growing a disk (growpart).
- name: Keep cloud-init from running after the first boot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud-init.disabled
    content: "Disabled by Ansible (role common): cloud-init only runs on first boot.\n"
    owner: root
    group: root
    mode: "0644"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Enable chrony
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started

- name: Configure unattended security upgrades (no automatic reboot)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
    owner: root
    group: root
    mode: "0644"

- name: Enable periodic apt runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap persistent journal size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-size.conf
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ common_journald_max_use }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Network (netplan, resolvers)
  ansible.builtin.include_tasks: network.yml
