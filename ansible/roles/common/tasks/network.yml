---
# Cloud-init writes the netplan config once, on first boot. Ansible owns it
# after that (Terraform ignores cloud-init changes on existing VMs): the
# resolvers and IPv6 router advertisements on every ethernet interface.
#
# Nothing here runs `netplan apply` or `networkctl reload`: systemd-networkd
# then drops addresses it does not own, such as the kube-vip VIP on a
# control-plane node. Resolvers are applied live with resolvectl. The RA
# setting takes effect at the next boot (`make reboot`, docs/maintenance.md).

- name: Netplan | Stop cloud-init from rewriting the network config
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: |
      # Managed by Ansible (role common): network config is set up once by
      # cloud-init and maintained by Ansible afterwards.
      network: {config: disabled}
    owner: root
    group: root
    mode: "0644"

- name: Netplan | Read the config
  ansible.builtin.slurp:
    src: "{{ common_netplan_file }}"
  register: common_netplan_raw

- name: Netplan | Set RA handling, resolvers and search domain on every ethernet interface
  ansible.builtin.set_fact:
    common_netplan: "{{ common_netplan_current | combine(common_netplan_patch, recursive=true) }}"
  vars:
    common_netplan_current: "{{ common_netplan_raw.content | b64decode | from_yaml }}"
    common_netplan_names: "{{ common_netplan_current.network.ethernets.keys() | list }}"
    common_netplan_ra:
      accept-ra: "{{ common_ipv6_accept_ra }}"
    common_netplan_ns:
      nameservers:
        addresses: "{{ common_dns_servers }}"
        search: "{{ common_dns_search }}"
    common_netplan_iface: "{{ common_netplan_ra | combine(common_netplan_ns if common_dns_servers | length > 0 else {}) }}"
    common_netplan_patch:
      network:
        ethernets: "{{ dict(common_netplan_names | zip([common_netplan_iface] * (common_netplan_names | length))) }}"

- name: Netplan | Write the config
  ansible.builtin.copy:
    dest: "{{ common_netplan_file }}"
    content: "{{ common_netplan | to_nice_yaml(indent=2) }}"
    owner: root
    group: root
    mode: "0600"
    backup: true

- name: Netplan | Validate the config
  ansible.builtin.command: netplan generate
  changed_when: false

- name: DNS | Read the live resolvers
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      resolvectl dns {{ item.value['set-name'] | default(item.key) }} | cut -d: -f2- &&
      resolvectl domain {{ item.value['set-name'] | default(item.key) }} | cut -d: -f2-
    executable: /bin/bash
  loop: "{{ common_netplan.network.ethernets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: common_dns_live
  changed_when: false
  when: common_dns_servers | length > 0

- name: DNS | Apply the resolvers now (no interface restart)
  ansible.builtin.shell: >-
    resolvectl dns {{ item.item.value['set-name'] | default(item.item.key) }} {{ common_dns_servers | join(' ') }} &&
    resolvectl domain {{ item.item.value['set-name'] | default(item.item.key) }}
    {{ (common_dns_search | map('quote') | join(' ')) if common_dns_search else "''" }}
  loop: "{{ common_dns_live.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  changed_when: true
  # IPv6 servers learned from router advertisements (the Starlink router, which
  # forwards to the lab DNS anyway) may sit next to them until the VM reboots
  # with RAs off, and are ignored here. An empty domain list prints an empty
  # second line, which stdout_lines drops.
  when: >-
    common_dns_servers | length > 0 and (
    item.stdout_lines | length < 1 or
    item.stdout_lines[0].split() | select('match', '^[0-9.]+$') | list != common_dns_servers or
    (item.stdout_lines[1] | default('')).split() != common_dns_search)
