---
- name: Check that the secret is loaded
  ansible.builtin.assert:
    that:
      - alloy_loki_password is defined
      - alloy_loki_password | length >= 24
    fail_msg: alloy_loki_password must come from logging/alloy.sops.yaml (see docs/logging.md).
    quiet: true
  no_log: true

# cloud-init is disabled after the first boot (role common), so it doesn't
# rewrite /etc/hosts.
- name: Resolve the Loki name without the lab DNS
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ alloy_loki_push_url | urlsplit("hostname") | regex_escape }}$'
    line: "{{ alloy_loki_static_address }} {{ alloy_loki_push_url | urlsplit('hostname') }}"
    owner: root
    group: root
    mode: "0644"
  when: alloy_loki_static_address | length > 0
  notify: Restart alloy

- name: Download the Alloy package
  ansible.builtin.get_url:
    url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-{{ alloy_version }}-1.amd64.deb"
    checksum: "sha256:https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/SHA256SUMS"
    dest: "/tmp/alloy-{{ alloy_version }}-1.amd64.deb"
    mode: "0644"

# The package creates the alloy user and adds it to adm and systemd-journal
# (journal access). Config files are written after it, so they are never
# overwritten by the package defaults.
- name: Install Alloy
  ansible.builtin.apt:
    deb: "/tmp/alloy-{{ alloy_version }}-1.amd64.deb"
  notify: Restart alloy

# Read access to the Docker API, which is root-equivalent on that host: the
# alloy user could start containers. Alloy only reads container logs.
- name: Let Alloy read container logs through the Docker socket
  ansible.builtin.user:
    name: alloy
    groups: docker
    append: true
  when: alloy_docker_logs | bool
  notify: Restart alloy

- name: Create the textfile directory for host metrics
  ansible.builtin.file:
    path: "{{ alloy_textfile_dir }}"
    state: directory
    owner: alloy
    group: alloy
    mode: "0755"
  when: alloy_node_metrics | bool

- name: Swarm service replica metrics
  when: alloy_swarm_services_metrics | bool
  block:
    - name: Check that container access and host metrics are on
      ansible.builtin.assert:
        that:
          - alloy_docker_logs | bool
          - alloy_node_metrics | bool
        fail_msg: alloy_swarm_services_metrics needs alloy_docker_logs (docker group) and alloy_node_metrics (textfile collector).
        quiet: true

    - name: Install the replica metrics script
      ansible.builtin.copy:
        src: swarm-services-metrics.py
        dest: /usr/local/bin/swarm-services-metrics
        owner: root
        group: root
        mode: "0755"

    - name: Write the replica metrics units
      ansible.builtin.template:
        src: "swarm-services-metrics.{{ item }}.j2"
        dest: "/etc/systemd/system/swarm-services-metrics.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]

    - name: Enable the replica metrics timer
      ansible.builtin.systemd_service:
        name: swarm-services-metrics.timer
        enabled: true
        state: started
        daemon_reload: true

- name: Write the Loki password
  ansible.builtin.copy:
    dest: /etc/alloy/loki-password
    content: "{{ alloy_loki_password }}"
    owner: root
    group: alloy
    mode: "0640"
  no_log: true
  notify: Restart alloy

- name: Write the Alloy service settings
  ansible.builtin.template:
    src: alloy.default.j2
    dest: /etc/default/alloy
    owner: root
    group: root
    mode: "0644"
  notify: Restart alloy

- name: Write the Alloy pipeline
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
    # Syntax check before the file is replaced.
    validate: /usr/bin/alloy fmt %s
  notify: Restart alloy

- name: Enable Alloy
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
