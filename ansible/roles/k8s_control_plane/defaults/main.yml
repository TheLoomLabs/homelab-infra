---
k8s_control_plane_first_node: "{{ groups['k8s_control_plane'] | first }}"
k8s_control_plane_kube_vip_kubeconfig: /etc/kubernetes/admin.conf
# Per-node kubeadm patches (templates/patches/): etcd metrics, kube-scheduler
# and kube-controller-manager on the node address. kubeadm applies them on
# init and join, and on upgrades only when called with --patches.
k8s_control_plane_patches_dir: /etc/kubernetes/patches

# Encryption at rest for Secrets and ConfigMaps (docs/encryption.md). The keys
# come from k8s/encryption.sops.yaml (k8s_control_plane_encryption_keys: list of name +
# 32-byte base64 secret; the first entry encrypts, all of them decrypt).
k8s_control_plane_encryption_dir: /etc/kubernetes/encryption
k8s_control_plane_encryption_config: "{{ k8s_control_plane_encryption_dir }}/config.yaml"
k8s_control_plane_encryption_resources:
  - secrets
  - configmaps
# true only for the first pass on a running cluster, and for the first step
# of removing encryption again: every API server must be able to read the
# key before any of them writes with it.
k8s_control_plane_encryption_identity_first: false

# Pod Security Admission defaults for namespaces without labels
# (docs/pod-security.md). Labelled namespaces (kubernetes/platform/namespaces/)
# keep their own level; exempt namespaces are not checked at all.
k8s_control_plane_admission_dir: /etc/kubernetes/admission
k8s_control_plane_admission_config: "{{ k8s_control_plane_admission_dir }}/config.yaml"
k8s_control_plane_pod_security_defaults:
  enforce: baseline
  audit: restricted
  warn: restricted
# kube-system: static pods and Cilium must start before Argo CD has applied
# any label, on a fresh cluster.
k8s_control_plane_pod_security_exempt_namespaces:
  - kube-system

# Kubernetes audit log (docs/audit-logging.md). The API server writes JSON
# lines to the log file and rotates it by size; Alloy on the node ships them
# to Loki ({source="audit"}). The files on the node are only a buffer for
# Loki outages: 4 × 100 MB at most, none older than 7 days.
k8s_control_plane_audit_dir: /etc/kubernetes/audit
k8s_control_plane_audit_policy: "{{ k8s_control_plane_audit_dir }}/policy.yaml"
k8s_control_plane_audit_log_dir: /var/log/kubernetes/audit
k8s_control_plane_audit_log_args:
  audit-policy-file: "{{ k8s_control_plane_audit_policy }}"
  audit-log-path: "{{ k8s_control_plane_audit_log_dir }}/audit.log"
  audit-log-format: json
  audit-log-maxsize: "100"
  audit-log-maxbackup: "3"
  audit-log-maxage: "7"
  # Events over 100 KB lose their bodies first (Loki rejects lines over
  # 256 KB).
  audit-log-truncate-enabled: "true"
# Cluster components whose reads are not logged and whose writes get
# metadata only (templates/audit-policy.yaml.j2).
k8s_control_plane_audit_system_users:
  - system:apiserver
  - system:kube-controller-manager
  - system:kube-scheduler
k8s_control_plane_audit_system_groups:
  - system:nodes
  - system:serviceaccounts:kube-system
  - system:serviceaccounts:longhorn-system
# Writes with metadata only (no request body). Argo CD applies what is in Git.
k8s_control_plane_audit_metadata_users:
  - system:serviceaccount:argocd:argocd-application-controller
