---
- name: Base
  ansible.builtin.import_playbook: base.yml

- name: DNS
  ansible.builtin.import_playbook: dns.yml

- name: Kubernetes
  ansible.builtin.import_playbook: kubernetes.yml

- name: Longhorn storage nodes
  ansible.builtin.import_playbook: longhorn.yml

- name: SOPS age key
  ansible.builtin.import_playbook: sops.yml

- name: Argo CD
  ansible.builtin.import_playbook: argocd.yml

- name: Docker Swarm
  ansible.builtin.import_playbook: swarm.yml

# Before the Swarm stacks: edge needs Alloy's textfile directory.
- name: Log shipping from the VMs
  ansible.builtin.import_playbook: logs.yml

- name: Edge on Swarm (VIP, Traefik, certificate)
  ansible.builtin.import_playbook: edge.yml

- name: Alerting stack on Swarm
  ansible.builtin.import_playbook: alerting.yml

- name: Uptime Kuma on Swarm
  ansible.builtin.import_playbook: uptime.yml

- name: Portainer on Swarm
  ansible.builtin.import_playbook: portainer.yml

# After logs.yml: the backup metrics go to Alloy's textfile directory.
- name: Swarm volume backups
  ansible.builtin.import_playbook: swarm-backup.yml

# After logs.yml (Alloy on the runner). Forgejo itself comes from Argo CD; the
# runner retries until it answers.
- name: Forgejo Actions runner
  ansible.builtin.import_playbook: runner.yml
