---
# Decrypts SopsSecret resources in the cluster and creates the Secrets they
# describe, so Git only ever holds encrypted values (ADR 0006). The age key it
# decrypts with is created by Ansible (playbooks/sops.yml), never from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets-operator
  namespace: argocd
  annotations:
    # Before any Application that ships a SopsSecret.
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  sources:
    - repoURL: https://isindir.github.io/sops-secrets-operator/
      chart: sops-secrets-operator
      targetRevision: 0.28.1
      helm:
        releaseName: sops-secrets-operator
        valueFiles:
          - $values/kubernetes/platform/sops-secrets-operator/values.yaml
    - repoURL: https://github.com/TheLoomLabs/homelab-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Ansible creates the namespace first (it holds the age key); this
      # covers a rebuild where Argo CD gets there first.
      - CreateNamespace=true
      - ServerSideApply=true
