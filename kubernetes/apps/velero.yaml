---
# Velero backs up Kubernetes objects to Cloudflare R2 and has Longhorn back up
# the volumes through CSI snapshots (ADR 0010). The same app ships the
# encrypted R2 credentials and SSE-C key (SopsSecret).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    # After longhorn (-4): volume backups need the backup target.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.2.1
      helm:
        releaseName: velero
        valueFiles:
          - $values/kubernetes/platform/velero/values.yaml
    - repoURL: https://github.com/TheLoomLabs/homelab-infra.git
      targetRevision: main
      ref: values
    # SopsSecret. values.yaml is Helm input, not a manifest.
    - repoURL: https://github.com/TheLoomLabs/homelab-infra.git
      targetRevision: main
      path: kubernetes/platform/velero
      directory:
        exclude: values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      # Never let a bad commit delete the backup system or its CRDs.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The SopsSecret CRD comes from another app.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
