---
# Prometheus Operator CRDs (ServiceMonitor, PrometheusRule, ...), as their own
# app so they exist before any component ships a ServiceMonitor or a
# PrometheusRule. kube-prometheus-stack installs no CRDs (crds.enabled false).
# Keep appVersion equal to kube-prometheus-stack's (both v0.94.1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    # Before longhorn (-4) and velero (-3), whose charts create ServiceMonitors.
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 32.0.2
    helm:
      releaseName: prometheus-operator-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      # Deleting the CRDs would delete every ServiceMonitor and PrometheusRule.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for client-side apply.
      - ServerSideApply=true
