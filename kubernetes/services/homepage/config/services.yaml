---
# Cards (https://gethomepage.dev/configs/services/), docs/homepage.md.
#
# Status:
#   Kubernetes apps: `namespace` + `app` (or `podSelector`) → pod status and
#   CPU/memory from the API and metrics-server. A new namespace needs a
#   RoleBinding in kubernetes/platform/app-rbac/homepage.yaml.
#   Swarm and the host: `siteMonitor`, an HTTP check from the Homepage pod.
#   A new host needs an egress rule in networkpolicy.yaml.
# Numbers: native widgets with read-only credentials, everything else from
# Prometheus (prometheusmetric). Widgets call in-cluster addresses, never the
# Gateway. Credentials are {{HOMEPAGE_VAR_*}} from the Secret homepage-env.
# Icons: dashboard-icons names (loaded by the browser from jsDelivr) or mdi-*.

- Status:
    - Alerts:
        icon: alertmanager.svg
        href: https://alertmanager.lab.theloomlabs.org
        description: Alertmanager (Watchdog, info not counted)
        namespace: monitoring
        app: alertmanager
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 30000
          metrics:
            - label: Critical
              query: count(ALERTS{alertstate="firing", severity="critical"}) or vector(0)
            - label: Warning
              query: count(ALERTS{alertstate="firing", severity="warning"}) or vector(0)

    - Argo CD:
        icon: argo-cd.svg
        href: https://argocd.lab.theloomlabs.org
        description: GitOps
        namespace: argocd
        app: argocd-server
        widget:
          type: argocd
          url: http://argocd-server.argocd.svc.cluster.local
          # Account homepage, read-only (kubernetes/platform/argocd/values.yaml).
          key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
          fields: [apps, synced, outOfSync, degraded]

    - Uptime Kuma:
        icon: uptime-kuma.svg
        href: https://status.lab.theloomlabs.org
        description: Checks from outside Kubernetes
        siteMonitor: https://status.lab.theloomlabs.org
        widget:
          type: uptimekuma
          url: https://status.lab.theloomlabs.org
          # The status page "lab" (docs/homepage.md, set up once in the UI).
          slug: lab

    - Backups:
        icon: mdi-backup-restore
        description: Last successful run
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 300000
          metrics:
            - label: Cluster (Velero)
              query: max(velero_backup_last_successful_timestamp{schedule!=""})
              format:
                type: relativeDate
                scale: 1000
            - label: Vaultwarden
              query: max(kube_cronjob_status_last_successful_time{namespace="vaultwarden", cronjob="vaultwarden-backup"})
              format:
                type: relativeDate
                scale: 1000
            - label: Forgejo
              query: max(kube_cronjob_status_last_successful_time{namespace="forgejo", cronjob="forgejo-backup"})
              format:
                type: relativeDate
                scale: 1000
            - label: Authentik
              query: max(kube_cronjob_status_last_successful_time{namespace="authentik", cronjob="authentik-backup"})
              format:
                type: relativeDate
                scale: 1000
            - label: Swarm (oldest)
              query: min(swarm_backup_volume_last_success_timestamp_seconds)
              format:
                type: relativeDate
                scale: 1000

    # Read from Prometheus, not from Longhorn's API: that API has no login and
    # can delete volumes.
    - Longhorn:
        icon: longhorn.svg
        href: https://longhorn.lab.theloomlabs.org
        description: Storage
        namespace: longhorn-system
        podSelector: app=longhorn-manager
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 60000
          metrics:
            - label: Used
              query: sum(longhorn_node_storage_usage_bytes)
              format:
                type: bytes
            - label: Capacity
              query: sum(longhorn_node_storage_capacity_bytes)
              format:
                type: bytes
            - label: Not healthy
              query: count(longhorn_volume_robustness{state=~"degraded|faulted"} == 1) or vector(0)

- Apps:
    - Vaultwarden:
        icon: vaultwarden.svg
        href: https://vault.lab.theloomlabs.org
        description: Passwords
        namespace: vaultwarden
        app: vaultwarden
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 300000
          metrics:
            - label: Last backup
              query: max(kube_cronjob_status_last_successful_time{namespace="vaultwarden", cronjob="vaultwarden-backup"})
              format:
                type: relativeDate
                scale: 1000
            - label: Last check
              query: max(kube_cronjob_status_last_successful_time{namespace="vaultwarden", cronjob="vaultwarden-backup-check"})
              format:
                type: relativeDate
                scale: 1000

    - Forgejo:
        icon: forgejo.svg
        href: https://git.lab.theloomlabs.org
        description: Git, packages, Actions
        namespace: forgejo
        app: forgejo
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 300000
          metrics:
            # Forgejo's /metrics (servicemonitor.yaml), gitea_* names.
            - label: Repos
              query: max(gitea_repositories{namespace="forgejo"})
            - label: Last backup
              query: max(kube_cronjob_status_last_successful_time{namespace="forgejo", cronjob="forgejo-backup"})
              format:
                type: relativeDate
                scale: 1000

    - Authentik:
        icon: authentik.svg
        href: https://auth.lab.theloomlabs.org
        description: Single sign-on
        namespace: authentik
        app: authentik
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 300000
          metrics:
            - label: Last backup
              query: max(kube_cronjob_status_last_successful_time{namespace="authentik", cronjob="authentik-backup"})
              format:
                type: relativeDate
                scale: 1000
            - label: Last check
              query: max(kube_cronjob_status_last_successful_time{namespace="authentik", cronjob="authentik-backup-check"})
              format:
                type: relativeDate
                scale: 1000

- Kubernetes:
    - Workloads:
        icon: kubernetes.svg
        description: Pods in the cluster (kube-state-metrics)
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 30000
          metrics:
            - label: Running
              query: sum(kube_pod_status_phase{phase="Running"})
            - label: Pending
              query: sum(kube_pod_status_phase{phase="Pending"})
            - label: Failed
              query: sum(kube_pod_status_phase{phase=~"Failed|Unknown"})
            - label: Restarts 24h
              query: round(sum(increase(kube_pod_container_status_restarts_total[24h])))

    - Grafana:
        icon: grafana.svg
        href: https://grafana.lab.theloomlabs.org
        description: Dashboards, logs (Loki)
        namespace: monitoring
        app: grafana
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 60000
          metrics:
            - label: Dashboards
              query: max(grafana_stat_totals_dashboard)
            - label: Log lines/s
              query: sum(rate(loki_distributor_lines_received_total[5m]))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Logs 24h
              query: sum(increase(loki_distributor_bytes_received_total[24h]))
              format:
                type: bytes

    - Prometheus:
        icon: prometheus.svg
        href: https://prometheus.lab.theloomlabs.org
        description: Metrics
        namespace: monitoring
        app: prometheus
        widget:
          type: prometheus
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

- Swarm:
    # Swarm services from Prometheus (Alloy's replica metrics), not from
    # Portainer: a Portainer CE token can deploy containers.
    - Portainer:
        icon: portainer.svg
        href: https://portainer.lab.theloomlabs.org
        description: Swarm stacks
        siteMonitor: https://portainer.lab.theloomlabs.org/api/system/status
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 30000
          metrics:
            - label: Services
              query: count(max by (stack, service) (swarm_service_replicas_desired{mode!~".*-job"}))
            - label: Running
              query: >-
                count(max by (stack, service) (swarm_service_replicas_running{mode!~".*-job"})
                >= max by (stack, service) (swarm_service_replicas_desired{mode!~".*-job"}))
                or vector(0)

    - Traefik:
        icon: traefik.svg
        description: Edge router on every manager (VIP)
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 30000
          metrics:
            - label: Instances up
              query: count(up{job="traefik"} == 1) or vector(0)
            - label: Requests/s
              query: sum(rate(traefik_entrypoint_requests_total[5m]))
              format:
                type: number
                options:
                  maximumFractionDigits: 1
            - label: 5xx/s
              query: sum(rate(traefik_entrypoint_requests_total{code=~"5.."}[5m])) or vector(0)
              format:
                type: number
                options:
                  maximumFractionDigits: 2

    - ntfy:
        icon: ntfy.svg
        href: https://ntfy.lab.theloomlabs.org
        description: Notifications (from Alertmanager)
        siteMonitor: https://ntfy.lab.theloomlabs.org/v1/health
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 300000
          metrics:
            - label: Failed sends 24h
              query: round(sum(increase(alertmanager_notifications_failed_total[24h]))) or vector(0)

    - healthchecks:
        icon: healthchecks.svg
        href: https://hc.lab.theloomlabs.org
        description: Dead man's switch
        siteMonitor: https://hc.lab.theloomlabs.org
        widget:
          type: healthchecks
          url: https://hc.lab.theloomlabs.org
          # Read-only API key of the project.
          key: "{{HOMEPAGE_VAR_HEALTHCHECKS_KEY}}"

- Infrastructure:
    - Proxmox:
        icon: proxmox.svg
        href: https://pve.lab.theloomlabs.org:8006
        description: pve
        siteMonitor: https://pve.lab.theloomlabs.org:8006
        widget:
          type: proxmox
          url: https://pve.lab.theloomlabs.org:8006
          # API token of homepage@pve, role PVEAuditor (read only).
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: pve

    - DNS:
        icon: mdi-dns
        description: BIND on dns-01, dns-02
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 30000
          metrics:
            - label: Servers up
              query: count(up{job="node-exporter", group="dns"} == 1) or vector(0)
            - label: CPU
              query: 100 * avg(1 - rate(node_cpu_seconds_total{group="dns", mode="idle"}[5m]))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
            - label: Memory
              query: >-
                100 * (1 - sum(node_memory_MemAvailable_bytes{group="dns"})
                / sum(node_memory_MemTotal_bytes{group="dns"}))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0

    - Swarm managers:
        icon: docker.svg
        description: swarm-m-01..03 (Alloy on the VMs)
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 30000
          metrics:
            - label: Nodes up
              query: count(up{job="node-exporter", group="swarm"} == 1) or vector(0)
            - label: CPU
              query: 100 * avg(1 - rate(node_cpu_seconds_total{group="swarm", mode="idle"}[5m]))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
            - label: Memory
              query: >-
                100 * (1 - sum(node_memory_MemAvailable_bytes{group="swarm"})
                / sum(node_memory_MemTotal_bytes{group="swarm"}))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0

    - Forgejo runner:
        icon: forgejo.svg
        href: https://git.lab.theloomlabs.org/admin/actions/runners
        description: runner-01, Actions jobs in Docker
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 30000
          metrics:
            # The VM, not the runner service: Forgejo has no runner metrics.
            - label: VM up
              query: count(up{job="node-exporter", group="ci"} == 1) or vector(0)
            - label: CPU
              query: 100 * avg(1 - rate(node_cpu_seconds_total{group="ci", mode="idle"}[5m]))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
            - label: Memory
              query: >-
                100 * (1 - sum(node_memory_MemAvailable_bytes{group="ci"})
                / sum(node_memory_MemTotal_bytes{group="ci"}))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
            # Job images and build cache; the weekly prune frees it.
            - label: Disk
              query: >-
                100 * (1 - max(node_filesystem_avail_bytes{group="ci", mountpoint="/"})
                / max(node_filesystem_size_bytes{group="ci", mountpoint="/"}))
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
