---
# Header widgets (https://gethomepage.dev/widgets/info/). Look: custom.css.
- greeting:
    text_size: xl
    text: THELOOMLABS

# Nodes and their CPU/memory: the API server and metrics-server, through the
# ServiceAccount (ClusterRole homepage-nodes).
- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: homelab
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true

- datetime:
    text_size: xl
    locale: en-GB
    format:
      dateStyle: medium
      timeStyle: short
      hour12: false
