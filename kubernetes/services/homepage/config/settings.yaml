---
# Homepage settings (https://gethomepage.dev/configs/settings/).
# Look and feel: custom.css.
title: TheLoomLabs
description: Lab dashboard
theme: dark
color: slate
# Look: custom.css (option D of the dashboard designs). The page uses the
# whole window width; text stays at its normal size.
headerStyle: clean
fullWidth: true
statusStyle: dot
hideVersion: true
# No call to GitHub for new releases: the pod has no internet access, and
# Renovate already reports new versions.
disableUpdateCheck: true
target: _blank
useEqualHeights: true

# The search box (type anywhere) searches the cards and bookmarks only: no
# internet search provider, nothing typed leaves the browser.
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  showSearchSuggestions: false

# Groups in services.yaml, top to bottom; one row each. Status first: the
# five readouts that say whether anything needs attention.
layout:
  Status:
    style: row
    columns: 5
  Apps:
    style: row
    columns: 4
  Kubernetes:
    style: row
    columns: 4
  Swarm:
    style: row
    columns: 4
  Infrastructure:
    style: row
    columns: 4
