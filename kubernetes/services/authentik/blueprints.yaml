---
# Authentik's config in Git (https://docs.goauthentik.io/customize/blueprints/).
# The worker reads every *.yaml key from /blueprints/mounted/cm-authentik-blueprints/,
# applies it at start and again when the file changes (Argo CD updates the
# ConfigMap, the kubelet the mounted files, within a minute or two). An entry
# without `state` is `present`: created if missing, the listed attributes put
# back if someone changed them in the UI. Attributes not listed stay as they
# are. Removing an entry here doesn't delete the object in Authentik.
#
# Users are not here: no usernames in the public repo. Accounts are created
# in the UI and put into a group (docs/sso.md).
#
# Apps (lab-app-*.yaml): one OAuth2/OIDC provider + application each. Client
# IDs are here, client secrets come from the worker's environment (`!Env`,
# Secret authentik-oidc, oidc.sops.yaml); the app gets the same value from its
# own SopsSecret. Issuer: https://auth.lab.theloomlabs.org/application/o/<slug>/
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  lab-groups.yaml: |
    version: 1
    metadata:
      name: Lab - Groups
    entries:
      # Admin everywhere: Authentik superuser, and the admin role in each app
      # (each app's provider maps this group, docs/sso.md).
      - model: authentik_core.group
        identifiers:
          name: lab-admins
        attrs:
          is_superuser: true
      # Signed-in users without admin rights in the apps.
      - model: authentik_core.group
        identifiers:
          name: lab-users
        attrs:
          is_superuser: false

  lab-mfa.yaml: |
    version: 1
    metadata:
      name: Lab - MFA required
    entries:
      # Apply the default flows first: the stages below come from them.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - WebAuthn MFA setup flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - TOTP MFA setup flow
          required: true
      # The default login asks for a second factor only if the user has one
      # (`skip`). `configure`: whoever has none sets one up at the next login,
      # a passkey/security key (WebAuthn) or an authenticator app (TOTP).
      # Static recovery codes count as a factor once created (user settings).
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          not_configured_action: configure
          device_classes:
            - webauthn
            - totp
            - static
          configuration_stages:
            - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]

  lab-app-argocd.yaml: |
    version: 1
    metadata:
      name: Lab - App Argo CD
    entries:
      # Argo CD (kubernetes/platform/argocd/values.yaml, oidc.config). The
      # second redirect is the CLI: argocd login --sso. Only lab-admins: Argo CD
      # has no role for anyone else (policy.default is empty).
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Lab - Groups
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider invalidation flow
          required: true
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Empty (the default for a new provider since 2026.x) allows no
          # flow at all: every login fails with invalid_request.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: argocd
          client_secret: !Env OIDC_ARGOCD_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.lab.theloomlabs.org/auth/callback
            - matching_mode: strict
              url: http://localhost:8085/auth/callback
          # RS256 with Authentik's own key, published in the JWKS.
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          # profile carries preferred_username and groups.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          provider: !KeyOf provider
          meta_launch_url: https://argocd.lab.theloomlabs.org
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/argo-cd.svg
          # Allowed if any binding below matches; nobody else gets a token.
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !Find [authentik_core.group, [name, lab-admins]]
        attrs:
          order: 0

  lab-app-grafana.yaml: |
    version: 1
    metadata:
      name: Lab - App Grafana
    entries:
      # Grafana (kubernetes/platform/monitoring/values.yaml, generic_oauth):
      # lab-admins become Admin, lab-users Viewer (role_attribute_path).
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Lab - Groups
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider invalidation flow
          required: true
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Empty (the default for a new provider since 2026.x) allows no
          # flow at all: every login fails with invalid_request.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: grafana
          client_secret: !Env OIDC_GRAFANA_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.lab.theloomlabs.org/login/generic_oauth
          # RS256 with Authentik's own key, published in the JWKS.
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          # profile carries preferred_username and groups.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf provider
          meta_launch_url: https://grafana.lab.theloomlabs.org
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/grafana.svg
          # Allowed if any binding below matches; nobody else gets a token.
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !Find [authentik_core.group, [name, lab-admins]]
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !Find [authentik_core.group, [name, lab-users]]
        attrs:
          order: 1

  lab-app-forgejo.yaml: |
    version: 1
    metadata:
      name: Lab - App Forgejo
    entries:
      # Forgejo: login source `authentik`, added with the CLI (docs/sso.md); the
      # callback path carries that name. lab-admins become site admins
      # (--admin-group), lab-users regular users. Same layout as Grafana's.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Lab - Groups
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider invalidation flow
          required: true
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: forgejo
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: forgejo
          client_secret: !Env OIDC_FORGEJO_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://git.lab.theloomlabs.org/user/oauth2/authentik/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: forgejo
        attrs:
          name: Forgejo
          provider: !KeyOf provider
          meta_launch_url: https://git.lab.theloomlabs.org
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/forgejo.svg
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !Find [authentik_core.group, [name, lab-admins]]
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !Find [authentik_core.group, [name, lab-users]]
        attrs:
          order: 1

  lab-app-homepage.yaml: |
    version: 1
    metadata:
      name: Lab - App Homepage
    entries:
      # Homepage (kubernetes/services/homepage/homepage.yaml, HOMEPAGE_OIDC_*):
      # its only login. Homepage has no roles: whoever Authentik lets in sees
      # the dashboard.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Lab - Groups
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider invalidation flow
          required: true
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: homepage
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: homepage
          client_secret: !Env OIDC_HOMEPAGE_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://home.lab.theloomlabs.org/api/auth/callback/homepage-oidc
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: homepage
        attrs:
          name: Homepage
          provider: !KeyOf provider
          meta_launch_url: https://home.lab.theloomlabs.org
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/homepage.svg
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !Find [authentik_core.group, [name, lab-admins]]
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !Find [authentik_core.group, [name, lab-users]]
        attrs:
          order: 1

  lab-app-portainer.yaml: |
    version: 1
    metadata:
      name: Lab - App Portainer
    entries:
      # Portainer CE (Swarm): OAuth settings in its UI (docs/sso.md), redirect
      # URL exactly as below. CE can't map groups to roles: SSO users are
      # created as standard users; promote yours once. Only lab-admins.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Lab - Groups
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider invalidation flow
          required: true
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: portainer
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: portainer
          client_secret: !Env OIDC_PORTAINER_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://portainer.lab.theloomlabs.org/
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        id: app
        identifiers:
