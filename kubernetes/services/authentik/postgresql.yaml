---
# Authentik's database: users, groups, providers, sessions, events. One
# PostgreSQL pod, no replication. Encrypted Longhorn volume (default class
# longhorn-encrypted, 2 replicas, hourly snapshots, daily + weekly backups to
# R2), also in the nightly Velero backup; those copies are crash-consistent,
# the nightly pg_dump (backup.yaml) is the clean one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: longhorn-encrypted
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: authentik
  labels:
    app.kubernetes.io/name: postgresql
spec:
  replicas: 1
  serviceName: postgresql
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Pod Security `restricted`: the image's postgres user (UID 999). PGDATA
      # is /var/lib/postgresql/18/docker (image default since 18), a
      # subdirectory of the volume, so ext4's lost+found is no problem.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # SIGTERM is a "smart" shutdown, which waits for Authentik to
      # disconnect; preStop does a fast one, so the database stops cleanly
      # instead of being killed (and recovering at the next start).
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          # Major upgrades need a dump and restore (docs/sso.md, "Upgrades");
          # Renovate stays on 18. The backup job uses the same image.
          image: postgres:18.6-trixie
          env:
            - name: POSTGRES_USER
              value: authentik
            - name: POSTGRES_DB
              value: authentik
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-postgresql
                  key: password
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, -U, authentik, -d, authentik, -h, 127.0.0.1]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [pg_isready, -U, authentik, -d, authentik, -h, 127.0.0.1]
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -U, authentik, -d, authentik, -h, 127.0.0.1]
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: [/bin/sh, -c, 'pg_ctl stop -D "$PGDATA" -m fast -w -t 50']
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            # Unix socket and lock file.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-data
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: authentik
  labels:
    app.kubernetes.io/name: postgresql
spec:
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
