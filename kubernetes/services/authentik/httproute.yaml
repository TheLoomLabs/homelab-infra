---
# Through the shared Gateway (ADR 0007): LAN and Tailscale only, TLS with the
# wildcard certificate. The *.lab record already points at the Gateway, so no
# DNS change. The Service is the chart's (authentik-server, port 80 → 9000).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    # group and kind spelled out: the API server defaults them, and Argo CD
    # would otherwise show the route as OutOfSync.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - auth.lab.theloomlabs.org
  # Defaults spelled out (match, group, kind, weight), same reason.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          port: 80
          weight: 1
---
# The UIs behind the embedded outpost (blueprint lab-proxy.yaml): the server
# answers for these names too and forwards signed-in requests to each UI
# (docs/sso.md#proxied-uis). Same Gateway, Service and defaults as above.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-proxy
  namespace: authentik
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - longhorn.lab.theloomlabs.org
    - prometheus.lab.theloomlabs.org
    - alertmanager.lab.theloomlabs.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          port: 80
          weight: 1
