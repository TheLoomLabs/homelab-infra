---
# App-level backup of Forgejo (docs/forgejo.md, ADR 0020), on top of
# Longhorn's volume backups and Velero. Every night at 01:45 UTC:
#
#   1. dump    `forgejo dump` without repositories, LFS, attachments,
#              packages, logs and indexes: a consistent SQL dump of the SQLite
#              database (forgejo-db.sql) plus app.ini and the small files in
#              data/, as /var/lib/gitea/backups/forgejo-db-<UTC time>.tar.gz;
#              the newest 7 are kept. Longhorn's backup at 02:00 and Velero's
#              at 03:00 carry them off-site with the volume.
#   2. restic  /var/lib/gitea (repositories, LFS, packages, attachments, the
#              SSH host key, the dumps; not the live database, the search
#              index or the queues) to the R2 bucket theloomlabs-forgejo-
#              backup, encrypted with the restic password. Independent of the
#              Longhorn key. Repositories are copied while Forgejo runs: a
#              push during the backup can leave that repository's refs one
#              push behind, never broken objects. The bucket lock keeps every
#              snapshot, so the job never runs forget/prune (quarterly by
#              hand, docs/forgejo.md).
#
# The volume is ReadWriteOnce, so the job runs next to the Forgejo pod
# (podAffinity); while Forgejo isn't running, the job waits and fails after
# activeDeadlineSeconds, and ForgejoBackupStale fires the next day.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-backup
  namespace: forgejo
spec:
  # 15 minutes after Vaultwarden's, before Longhorn's backup at 02:00.
  schedule: "45 1 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      # Failed jobs (and ForgejoBackupFailed) go after 20 h; the logs stay in
      # Loki.
      ttlSecondsAfterFinished: 72000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: forgejo-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: forgejo
                  topologyKey: kubernetes.io/hostname
          initContainers:
            - name: dump
              image: codeberg.org/forgejo/forgejo:15.0.10-rootless
              envFrom:
                - configMapRef:
                    name: forgejo-env
                - secretRef:
                    name: forgejo-secrets
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  # Writes app.ini from the template and forgejo-env, as at
                  # the server's start.
                  # chmod on /etc/gitea fails (emptyDir, not ours); harmless.
                  /usr/local/bin/docker-setup.sh
                  mkdir -p /var/lib/gitea/backups
                  # Built in /tmp, moved in only when complete. The file name
                  # must end in the type's extension, or `forgejo dump`
                  # appends one (".part" became ".part.tar.gz").
                  name=forgejo-db-$(date -u +%Y%m%d_%H%M%S).tar.gz
                  forgejo dump --config "$GITEA_APP_INI" --type tar.gz \
                    --file "/tmp/$name" --tempdir /tmp \
                    --skip-repository --skip-lfs-data --skip-attachment-data \
                    --skip-package-data --skip-log --skip-index \
                    --skip-repo-archives --skip-custom-dir
                  # The SQL dump is forgejo-db.sql (gitea-db.sql in older
                  # releases); no SQL, no backup.
                  tar -tzf "/tmp/$name" | grep -Eqx '(forgejo|gitea)-db\.sql' \
                    || { echo "no SQL dump in /tmp/$name" >&2; exit 1; }
                  mv "/tmp/$name" /var/lib/gitea/backups/
                  # Leftovers of interrupted runs, then keep the newest 7.
                  rm -f /var/lib/gitea/backups/*.part /var/lib/gitea/backups/*.part.tar.gz
                  ls -1t /var/lib/gitea/backups/forgejo-db-*.tar.gz | tail -n +8 | xargs -r rm -f --
                  ls -l /var/lib/gitea/backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /var/lib/gitea
                - name: config
                  mountPath: /etc/gitea
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: restic
              image: restic/restic:0.19.1
              envFrom:
                - secretRef:
                    name: forgejo-restic
              env:
                - name: AWS_DEFAULT_REGION
                  value: auto
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # First run: create the repository. Any other error (wrong
                  # password, no network) makes init fail too ("already exists").
                  restic cat config >/dev/null 2>&1 || restic init
                  # The live database is excluded: the dump is the consistent
                  # copy. lost+found (ext4, root only) would make the snapshot
                  # incomplete (exit 3).
                  restic backup /var/lib/gitea --host forgejo --tag forgejo \
                    --exclude /var/lib/gitea/lost+found \
                    --exclude /var/lib/gitea/data/forgejo.db \
                    --exclude '/var/lib/gitea/data/forgejo.db-*' \
                    --exclude /var/lib/gitea/data/repo-archive \
                    --exclude /var/lib/gitea/data/tmp \
                    --exclude /var/lib/gitea/indexers \
                    --exclude /var/lib/gitea/queues
                  restic snapshots --host forgejo --latest 1
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /var/lib/gitea
                  readOnly: true
                - name: cache
                  mountPath: /cache
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: forgejo-data
            - name: config
              emptyDir:
                sizeLimit: 16Mi
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
---
# Weekly `restic check`: repository structure plus a random 5% of the data,
# downloaded and verified (R2 has no egress fees). Doesn't need the volume.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-backup-check
  namespace: forgejo
spec:
  schedule: "45 5 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 72000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: forgejo-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: restic/restic:0.19.1
              envFrom:
                - secretRef:
                    name: forgejo-restic
              env:
                - name: AWS_DEFAULT_REGION
                  value: auto
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: HOME
                  value: /tmp
              args:
                - check
                - --read-data-subset
                - 5%
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: cache
                  mountPath: /cache
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
