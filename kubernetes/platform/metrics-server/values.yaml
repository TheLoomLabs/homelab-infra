---
# Helm values for the metrics-server chart (kubernetes/apps/metrics-server.yaml).
# The chart's defaults already run it as UID 1000 with a read-only root
# filesystem, no capabilities and the RuntimeDefault seccomp profile.

# Two replicas on different workers: the API server calls this for every
# `kubectl top` and every metrics.k8s.io request; one pod restarting would make
# the whole aggregated API unavailable (KubeAggregatedAPIDown).
replicas: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: metrics-server

# The node addresses are the only names that work: node names (k8s-cp-01, ...)
# aren't in the cluster DNS.
defaultArgs:
  - --cert-dir=/tmp
  - --kubelet-preferred-address-types=InternalIP
  - --kubelet-use-node-status-port
  - --metric-resolution=15s

# The kubelets serve self-signed certificates (serverTLSBootstrap: false in the
# kubeadm config), so there is no CA to check them against. Prometheus scrapes
# the kubelets the same way. Proper kubelet serving certificates (kubelet CSRs
# signed by the cluster CA plus an approver) are a later hardening step;
# docs/monitoring.md, "Resource metrics API".
args:
  - --kubelet-insecure-tls

# The other direction is verified: the API server checks metrics-server's
# certificate against the CA bundle that cert-manager's cainjector writes into
# the APIService (self-signed Issuer + Certificate from the chart). The chart's
# default would be a self-signed certificate with insecureSkipTLSVerify.
tls:
  type: cert-manager
  certManager:
    addInjectorAnnotations: true
apiService:
  create: true
  insecureSkipTLSVerify: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
