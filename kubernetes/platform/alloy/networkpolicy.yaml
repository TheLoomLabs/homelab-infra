---
# Both Alloy releases (the log DaemonSet and alloy-events; docs/network-policy.md,
# the namespace's default deny is in kubernetes/platform/monitoring/). They
# discover pods and watch events through the API and push to Loki. Pod logs
# and the journal are files on the node, no network.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
