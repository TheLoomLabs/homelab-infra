---
# Helm values for the Alloy DaemonSet (release "alloy"), ADR 0012.
#
# One Alloy per node reads the pod log files under /var/log/pods and the
# node's systemd journal (kubelet, containerd, kernel, sshd...) and pushes
# both to Loki. Labels shared with the VMs outside the cluster:
#   source  pods | journal | events | docker
#   host    node or VM name
# Pod logs also get namespace, pod, container and app; journal lines get
# unit and level.

# The PodLogs CRD is not used.
crds:
  create: false

alloy:
  # No usage reports to Grafana Labs.
  enableReporting: false
  # Read positions on the node (hostPath below), so a restarted pod resumes
  # where it stopped instead of reading every file again.
  storagePath: /var/lib/alloy
  # Mounts the node's /var/log read-only: pod logs and the persistent journal.
  mounts:
    varlog: true
    extra:
      - name: state
        mountPath: /var/lib/alloy
      # The journal is stored under /var/log/journal/<machine-id>.
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  configMap:
    content: |
      // Pods on this node. HOSTNAME is the node name (set by the chart).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "host"
        }
        // First non-empty of app.kubernetes.io/name, app, k8s-app.
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_name",
            "__meta_kubernetes_pod_label_app",
            "__meta_kubernetes_pod_label_k8s_app",
          ]
          separator    = ";"
          regex        = ";*([^;]+).*"
          target_label = "app"
        }
        // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // containerd's CRI log format: timestamp, stream, flags, message.
        stage.cri {}

        stage.static_labels {
          values = { source = "pods" }
        }

        // One value per log file; the labels above already identify it.
        stage.label_drop {
          values = ["filename"]
        }

        forward_to = [loki.write.loki.receiver]
      }

      // The node's journal.
      loki.relabel "journal" {
        forward_to = []

        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
        rule {
          source_labels = ["__journal__transport"]
          regex         = "kernel"
          target_label  = "unit"
          replacement   = "kernel"
        }
        rule {
          source_labels = ["__journal_priority_keyword"]
          target_label  = "level"
        }
      }

      loki.source.journal "node" {
        path          = "/var/log/journal"
        // On first start, and after a long outage, read at most this far back.
        max_age       = "12h"
        relabel_rules = loki.relabel.journal.rules
        labels        = {
          source = "journal",
          host   = sys.env("HOSTNAME"),
        }
        forward_to    = [loki.write.loki.receiver]
      }

      // The API server's audit log (docs/audit-logging.md), only on the
      // control-plane nodes; on the workers the file never exists. One JSON
      // event per line; queries parse the fields with `| json`, so the
      // labels stay source and host. The API server rotates the file by
      // size and Alloy follows it by name.
      local.file_match "audit" {
        path_targets = [{
          __path__ = "/var/log/kubernetes/audit/audit.log",
          source   = "audit",
          host     = sys.env("HOSTNAME"),
        }]
      }

      loki.source.file "audit" {
        targets    = local.file_match.audit.targets
        forward_to = [loki.process.audit.receiver]
      }

      loki.process "audit" {
        // The event's own time, so lines read late (after a Loki or Alloy
        // outage) land where they happened.
        stage.json {
          expressions = { ts = "stageTimestamp" }
        }
        stage.timestamp {
          source = "ts"
          format = "RFC3339Nano"
        }
        stage.label_drop {
          values = ["filename"]
        }
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  # Also on the control-plane nodes.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    extra:
      - name: state
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File

serviceMonitor:
  enabled: true
