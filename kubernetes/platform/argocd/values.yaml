---
# Helm values for the argo-cd chart. Used both by the Ansible bootstrap and by
# the self-managed `argocd` Application, so the two never drift.
global:
  domain: argocd.lab.theloomlabs.org

configs:
  cm:
    # Cilium creates CiliumIdentity objects at runtime. Without this exclusion
    # Argo CD shows apps that contain pods as out of sync.
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
  params:
    # TLS ends at the shared Gateway (wildcard cert), which forwards plain HTTP.
    server.insecure: true

# Reached through the shared Gateway (kubernetes/platform/gateway) at
# https://argocd.lab.theloomlabs.org. The service stays ClusterIP.
# The argocd CLI needs --grpc-web through the Gateway.
server:
  httproute:
    enabled: true
    # group and kind spelled out: the API server defaults them, and Argo CD
    # would otherwise show the route as OutOfSync.
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: lab
        namespace: gateway
        sectionName: https
    hostnames:
      - argocd.lab.theloomlabs.org

# No SSO yet: the local admin account is enough for a single-user lab.
dex:
  enabled: false

# Enabled later together with Alertmanager → Mattermost.
notifications:
  enabled: false
