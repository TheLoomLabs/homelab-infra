---
# Helm values for the argo-cd chart. Used both by the Ansible bootstrap and by
# the self-managed `argocd` Application, so the two never drift.
global:
  domain: argocd.lab.theloomlabs.org

configs:
  cm:
    # Cilium creates CiliumIdentity objects at runtime. Without this exclusion
    # Argo CD shows apps that contain pods as out of sync.
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
    # Local account for the Homepage widget (docs/homepage.md): API tokens
    # only, no UI login. Its token is in Homepage's SOPS secret.
    accounts.homepage: apiKey
    # Login with Authentik (docs/sso.md). Argo CD's own OIDC client, no Dex.
    # The secret is read from the Secret argocd-oidc (oidc.sops.yaml; it
    # carries the label app.kubernetes.io/part-of: argocd, which Argo CD
    # requires for $secret:key references). profile carries `groups`.
    oidc.config: |
      name: Authentik
      issuer: https://auth.lab.theloomlabs.org/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes: ["openid", "profile", "email"]
  # Nobody gets anything by default (policy.default stays empty). homepage may
  # list and read Applications (sync and health status), nothing more: not
  # role:readonly, which also covers logs, clusters, repositories and
  # accounts. SSO users get their role from their Authentik groups (the
  # `groups` claim, chart default scopes).
  rbac:
    policy.csv: |
      p, role:homepage, applications, get, */*, allow
      g, homepage, role:homepage
      g, lab-admins, role:admin
  params:
    # TLS ends at the shared Gateway (wildcard cert), which forwards plain HTTP.
    server.insecure: true

# Reached through the shared Gateway (kubernetes/platform/gateway) at
# https://argocd.lab.theloomlabs.org. The service stays ClusterIP.
# The argocd CLI needs --grpc-web through the Gateway.
server:
  httproute:
    enabled: true
    # group and kind spelled out: the API server defaults them, and Argo CD
    # would otherwise show the route as OutOfSync.
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: lab
        namespace: gateway
        sectionName: https
    hostnames:
      - argocd.lab.theloomlabs.org

# SSO through Authentik's OIDC directly (configs.cm oidc.config), not Dex.
dex:
  enabled: false

# Enabled later together with Alertmanager → Mattermost.
notifications:
  enabled: false
