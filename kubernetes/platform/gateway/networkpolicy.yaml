---
# Default deny for every pod in gateway (docs/network-policy.md): once a policy
# selects a pod, it only gets what some policy allows. This one allows what
# every pod needs: DNS through Cilium's DNS proxy (the toFQDNs rules depend on
# it seeing the lookups) and scrapes from Prometheus.
# No pods run here today (the Gateway's Envoy is in kube-system); the policy
# keeps it that way unless something is allowed explicitly.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: gateway
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
