---
# Default deny for every pod in monitoring (docs/network-policy.md): once a policy
# selects a pod, it only gets what some policy allows. This one allows what
# every pod needs: DNS through Cilium's DNS proxy (the toFQDNs rules depend on
# it seeing the lookups) and scrapes from Prometheus.
# The Loki and Alloy apps add their own policies (kubernetes/platform/loki,
# kubernetes/platform/alloy). node-exporter runs in the host network, where
# pod policies don't apply.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# Prometheus scrapes everything in the cluster: pods in every namespace, the
# nodes (node-exporter, kubelet, etcd, scheduler, controller manager on the
# node addresses) and the API server. Any port: targets come and go with
# ServiceMonitors.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEntities:
        - cluster
---
# Alertmanager gets alerts from Prometheus (default-deny) and queries from
# Grafana, and sends notifications to ntfy and pings to healthchecks on the
# Swarm (Traefik, LAN addresses from the lab DNS).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchName: ntfy.lab.theloomlabs.org
        - matchName: hc.lab.theloomlabs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Grafana: the UI through the shared Gateway, its data sources (Prometheus,
# Alertmanager, Loki) and the API for the dashboard and data source sidecars.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# kube-state-metrics turns API objects into metrics.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# The Prometheus operator: manages Prometheus and Alertmanager through the API,
# and the API server calls its admission webhook for PrometheusRules.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-operator
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  ingress:
    # The API server's calls arrive through the tunnel from its node's
    # cilium_host address, so Cilium sees remote-node, not kube-apiserver
    # (Hubble, audit mode). Both, on the webhook port only.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
