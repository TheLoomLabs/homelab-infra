---
# Prometheus scrapes the VMs outside Kubernetes: the DNS and Swarm VMs
# (docs/monitoring.md, ADR 0011 amendment). Static targets: the VMs' LAN
# addresses (ansible/inventory/hosts.yml, generated by Terraform). Keep them in
# step with the inventory; the prometheus network policy
# (networkpolicy.yaml) allows exactly these addresses and ports.
#
# Every VM runs Alloy (Ansible role alloy) on port 12345. Alloy serves its own
# metrics on /metrics and each built-in exporter on
# /api/v0/component/<component name>/metrics.

# Host metrics: Alloy's built-in node_exporter. Job node-exporter, so
# kube-prometheus-stack's node alerts, recording rules and dashboards include
# the VMs.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: vm-node
  namespace: monitoring
spec:
  jobName: node-exporter
  metricsPath: /api/v0/component/prometheus.exporter.unix.node/metrics
  staticConfigs:
    - targets: ["192.168.1.11:12345"]
      labels:
        host: dns-01
        group: dns
    - targets: ["192.168.1.12:12345"]
      labels:
        host: dns-02
        group: dns
    - targets: ["192.168.1.41:12345"]
      labels:
        host: swarm-m-01
        group: swarm
    - targets: ["192.168.1.42:12345"]
      labels:
        host: swarm-m-02
        group: swarm
    - targets: ["192.168.1.43:12345"]
      labels:
        host: swarm-m-03
        group: swarm
  # instance = the VM name, like host. Readable in the node dashboards.
  relabelings:
    - sourceLabels: [host]
      targetLabel: instance
      action: replace
---
# Alloy itself (log shipping health: AlloyDroppingLogs, AlloyComponentUnhealthy).
# Its `up` is the VM's: VMHostDown.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: vm-alloy
  namespace: monitoring
spec:
  jobName: alloy-vm
  metricsPath: /metrics
  staticConfigs:
    - targets: ["192.168.1.11:12345"]
      labels:
        host: dns-01
        group: dns
    - targets: ["192.168.1.12:12345"]
      labels:
        host: dns-02
        group: dns
    - targets: ["192.168.1.41:12345"]
      labels:
        host: swarm-m-01
        group: swarm
    - targets: ["192.168.1.42:12345"]
      labels:
        host: swarm-m-02
        group: swarm
    - targets: ["192.168.1.43:12345"]
      labels:
        host: swarm-m-03
        group: swarm
  # instance = the VM name, like host. Readable in the node dashboards.
  relabelings:
    - sourceLabels: [host]
      targetLabel: instance
      action: replace
---
# Container metrics: Alloy's built-in cAdvisor on the Docker hosts.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: docker-cadvisor
  namespace: monitoring
spec:
  jobName: docker-cadvisor
  metricsPath: /api/v0/component/prometheus.exporter.cadvisor.containers/metrics
  staticConfigs:
    - targets: ["192.168.1.41:12345"]
      labels:
        host: swarm-m-01
        group: swarm
    - targets: ["192.168.1.42:12345"]
      labels:
        host: swarm-m-02
        group: swarm
    - targets: ["192.168.1.43:12345"]
      labels:
        host: swarm-m-03
        group: swarm
  # instance = the VM name, like host. Readable in the node dashboards.
  relabelings:
    - sourceLabels: [host]
      targetLabel: instance
      action: replace
---
# Docker engine metrics (daemon.json metrics-addr, role docker). On the
# managers they include the Swarm: swarm_manager_leader, swarm_manager_nodes,
# swarm_manager_tasks_total, raft latencies.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: docker-engine
  namespace: monitoring
spec:
  jobName: docker-engine
  metricsPath: /metrics
  staticConfigs:
    - targets: ["192.168.1.41:9323"]
      labels:
        host: swarm-m-01
        group: swarm
    - targets: ["192.168.1.42:9323"]
      labels:
        host: swarm-m-02
        group: swarm
    - targets: ["192.168.1.43:9323"]
      labels:
        host: swarm-m-03
        group: swarm
  # instance = the VM name, like host. Readable in the node dashboards.
  relabelings:
    - sourceLabels: [host]
      targetLabel: instance
      action: replace
---
# Traefik of the alerting stack: its metrics entrypoint, published in host
# mode on the node it runs on (alerting_node, ansible/roles/alerting). Same
# node as the ntfy/hc records in dns/records.yml.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: traefik
  namespace: monitoring
spec:
  jobName: traefik
  metricsPath: /metrics
  staticConfigs:
    - targets: ["192.168.1.41:8082"]
      labels:
        host: swarm-m-01
        group: swarm
  # instance = the VM name, like host. Readable in the node dashboards.
  relabelings:
    - sourceLabels: [host]
      targetLabel: instance
      action: replace
