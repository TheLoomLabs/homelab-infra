---
# Grafana through the shared Gateway (ADR 0007), LAN and Tailscale only.
# Prometheus and Alertmanager have no login of their own: they are published
# behind Authentik's proxy (route authentik-proxy in
# kubernetes/services/authentik/httproute.yaml, docs/sso.md#proxied-uis).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    # group and kind spelled out: the API server defaults them, and Argo CD
    # would otherwise show the route as OutOfSync.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.lab.theloomlabs.org
  # Defaults spelled out (match, group, kind, weight): the API server fills
  # them in, and Argo CD would otherwise show the route as OutOfSync.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1
