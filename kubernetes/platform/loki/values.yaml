---
# Helm values for Loki (grafana-community/loki chart), ADR 0012.
#
# One Loki process (single binary) with its index and chunks on a Longhorn
# volume. No object storage: logs are disposable, like metrics, and one
# replica is enough for a homelab.

deploymentMode: Monolithic

loki:
  # One tenant ("fake"); access is controlled by the gateway's basic auth for
  # clients outside the cluster.
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  # Starts before the first log line. A new schema later gets a new entry
  # with a future "from" date; never edit this one.
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  ingester:
    chunk_encoding: snappy

  # Log-based alerts (docs/audit-logging.md). In single-binary mode the ruler
  # runs inside the one Loki process. Rules come from Git: the ConfigMaps
  # loki-rules-audit (audit-rules.yaml) and loki-rules-vms (vms-rules.yaml)
  # are mounted read-only below; Loki re-reads the directory on every poll,
  # so a rule change needs no restart.
  # Firing alerts go to Alertmanager, which routes them like Prometheus'.
  rulerConfig:
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    # Scratch copy of the rules the ruler evaluates (writable volume).
    rule_path: /var/loki/ruler-scratch
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    # The link in an alert (generatorURL) opens Grafana's Explore.
    external_url: https://grafana.lab.theloomlabs.org/explore
    # Grafana's alerting page lists the rules through this API.
    enable_api: true

  # Merged with the chart's limits_config.
  limits_config:
    # 15 days, same as Prometheus. The compactor deletes older chunks.
    retention_period: 360h
    # After an outage every node's Alloy catches up on its journal at once;
    # the default 4 MB/s would reject part of that.
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  # No usage reports to Grafana Labs.
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  # Rules come from the ConfigMap below, not from the sidecar.
  sidecar: false
  # Tenant "fake" (auth_enabled: false) is the directory name.
  # Every loki-rules-* ConfigMap in one directory (audit-rules.yaml,
  # vms-rules.yaml); their data keys are the rule file names.
  extraVolumes:
    - name: rules
      projected:
        sources:
          - configMap:
              name: loki-rules-audit
          - configMap:
              name: loki-rules-vms
  extraVolumeMounts:
    - name: rules
      mountPath: /etc/loki/rules/fake
      readOnly: true
  # Plain longhorn class (two replicas, no encryption, no backups), like
  # Prometheus. Retention is by time only, so the default
  # KubePersistentVolumeFillingUp alerts are the guard against a full volume.
  persistence:
    enabled: true
    storageClass: longhorn
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

# nginx in front of Loki, only for clients outside the cluster (Alloy on the
# DNS and Swarm VMs) through the HTTPRoute loki.lab.theloomlabs.org. Inside
# the cluster, Alloy and Grafana talk to the loki service on port 3100.
gateway:
  enabled: true
  replicas: 1
  # Every push would otherwise be logged, and shipped to Loki again.
  verboseLogging: false
  basicAuth:
    enabled: true
    # gateway-auth.sops.yaml: .htpasswd with the user Alloy pushes as.
    existingSecret: loki-gateway-auth
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s

# Renders the ruler section of Loki's config (loki.rulerConfig above). The
# ruler's own StatefulSet exists only in distributed mode, so nothing else is
# created.
ruler:
  enabled: true

# Off: the rules sidecar (rules come from a ConfigMap), the memcached caches
# (the chunk cache alone asks for 8 GiB), the canary and its Helm test.
sidecar:
  rules:
    enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# The chart defaults to three replicas each for the simple-scalable targets;
# a monolithic install must zero them.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
