---
# Default deny for every pod in cert-manager (docs/network-policy.md): once a policy
# selects a pod, it only gets what some policy allows. This one allows what
# every pod needs: DNS through Cilium's DNS proxy (the toFQDNs rules depend on
# it seeing the lookups) and scrapes from Prometheus.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: cert-manager
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# Controller, cainjector, webhook and the startupapicheck job all use the API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-apiserver
  namespace: cert-manager
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# The API server calls the webhook to validate and convert cert-manager
# resources.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webhook-from-apiserver
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
# ACME with Let's Encrypt (production and staging issuers), DNS-01 records
# through the Cloudflare API, and the propagation checks against the public
# resolvers in values.yaml (dns01RecursiveNameservers).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: controller-to-acme
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  egress:
    - toFQDNs:
        - matchName: acme-v02.api.letsencrypt.org
        - matchName: acme-staging-v02.api.letsencrypt.org
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 1.1.1.1/32
        - 1.0.0.1/32
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
