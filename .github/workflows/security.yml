---
# Trivy scan of every image the lab runs (scripts/scan-images.py, docs/ci.md).
# Report only: findings go to Security -> Code scanning and the job summary;
# they never fail the run. Scan errors (an image that can't be pulled) do.
name: security

on:
  push:
    branches: [main]
    paths:
      - kubernetes/**
      - ansible/**
      - scripts/check-manifests.py
      - scripts/scan-images.py
      - .github/workflows/security.yml
  schedule:
    # Weekly, for CVEs published against images that didn't change.
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      # renovate: datasource=github-releases depName=helm/helm
      HELM_VERSION: v4.3.1
      # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The release binary, checksum-pinned, instead of a third-party action.
      - name: Install Trivy
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfLo /tmp/trivy.tar.gz "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Cache the Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Render the Argo CD apps
        run: python3 scripts/check-manifests.py --render-only

      - name: Scan images
        run: python3 scripts/scan-images.py

      - name: Upload to code scanning
        if: always() && hashFiles('.artifacts/images/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .artifacts/images/trivy.sarif
          category: trivy-images
