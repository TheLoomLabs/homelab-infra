---
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: terraform validate
        working-directory: terraform/envs/homelab
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ansible-core ansible-lint yamllint

      - name: yamllint
        run: yamllint .

      - name: Install collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint

  secrets:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLo /tmp/gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: Scan full git history
        run: gitleaks git --redact --verbose --exit-code 1 .

      - name: SOPS files are encrypted
        run: make sops-check

  manifests:
    runs-on: ubuntu-latest
    env:
      # Same version as helm_version in ansible/inventory/group_vars/k8s.yml
      # renovate: datasource=github-releases depName=helm/helm
      HELM_VERSION: v4.3.1
      # renovate: datasource=github-releases depName=yannh/kubeconform
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Same version as the Prometheus that kube-prometheus-stack deploys
      # renovate: datasource=github-releases depName=prometheus/prometheus extractVersion=^v(?<version>.+)$
      PROMETHEUS_VERSION: 3.15.0
      PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
      # Same version as the Loki that the loki chart deploys
      # renovate: datasource=github-releases depName=grafana/loki extractVersion=^v(?<version>.+)$
      LOKITOOL_VERSION: 3.7.8
      LOKITOOL_SHA256: 72b7c1ee1adfa28a3d4e3715221e26acacf5657bdef5643a34f859a8d2949672
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform, lokitool and promtool
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSfLo /tmp/kubeconform.tar.gz "${base}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          p="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          curl -sSfLo /tmp/prometheus.tar.gz "${base}/${p}.tar.gz"
          echo "${PROMETHEUS_SHA256}  /tmp/prometheus.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/prometheus.tar.gz -C /usr/local/bin --strip-components=1 "${p}/promtool"
          base="https://github.com/grafana/loki/releases/download/v${LOKITOOL_VERSION}"
          curl -sSfLo /tmp/lokitool.zip "${base}/lokitool-linux-amd64.zip"
          echo "${LOKITOOL_SHA256}  /tmp/lokitool.zip" | sha256sum -c -
          unzip -p /tmp/lokitool.zip lokitool-linux-amd64 > /tmp/lokitool
          sudo install -m 0755 /tmp/lokitool /usr/local/bin/lokitool

      - name: Render and validate the Argo CD apps
        run: make manifests
