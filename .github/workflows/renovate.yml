---
# Self-hosted Renovate (config: renovate.json, docs/ci.md). Opens PRs from the
# fine-grained token in the RENOVATE_TOKEN secret, so the lint checks run on
# them like on any PR. Nothing merges itself.
name: renovate

on:
  schedule:
    # Monday early morning. renovate.json creates PRs all of Monday
    # (Europe/Zagreb), so a run that GitHub starts hours late still opens them.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
      RENOVATE_VERSION: 44.167.7
    steps:
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Scheduled runs have no inputs: info.
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
