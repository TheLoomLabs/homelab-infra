---
extends: default

ignore: |
  .devbox/
  .terraform/
  ansible/collections/
  ansible/inventory/hosts.yml
  .artifacts/
  # Jinja templates are not plain YAML
  *.j2
  # Written by sops (no document start marker, long encrypted lines)
  kubernetes/**/*.sops.yaml
  dns/*.sops.yaml
  swarm/*.sops.yaml
  logging/*.sops.yaml
  k8s/*.sops.yaml

rules:
  line-length:
    max: 140
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
