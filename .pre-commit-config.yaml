---
# Hooks call the tools from the devbox shell (language: system), so the same
# versions run locally and in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive terraform
        language: system
        files: \.tf$
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]
      - id: ansible-lint
        name: ansible-lint
        entry: bash -c 'cd ansible && ansible-lint'
        language: system
        files: ^ansible/
        pass_filenames: false
