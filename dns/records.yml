---
# Lab zone, served by BIND on dns-01 (primary) and dns-02 (secondary).
# Every host in the Ansible inventory already gets an A record from its
# inventory name and address, and a PTR record. List only the extra names here.
# `make dns` deploys it; the SOA serial is bumped automatically. See docs/dns.md.
bind_zone: lab.theloomlabs.org

bind_records:
  # Shared Cilium Gateway (gateway/lab): every app name that is not listed
  # below or in the inventory, e.g. argocd.lab.theloomlabs.org.
  - {name: "*", type: A, value: 192.168.1.61}

  # Swarm stack "alerting" (ansible/roles/alerting). Its services run on one
  # node (alerting_node, default the first Swarm manager); keep this in step.
  - {name: ntfy, type: CNAME, value: swarm-m-01}
  - {name: hc, type: CNAME, value: swarm-m-01}

  # Other Swarm stacks behind the same Traefik. Its ports are published on
  # every Swarm node (ingress mode), so these follow the alerting names.
  - {name: status, type: CNAME, value: swarm-m-01}  # stack uptime (Uptime Kuma)
  - {name: portainer, type: CNAME, value: swarm-m-01}  # stack portainer

  # Infrastructure outside the inventory.
  - {name: pve, type: A, value: 192.168.1.200}
  - {name: k8s-api, type: A, value: 192.168.1.20}
